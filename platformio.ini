; PlatformIO Project Configuration File
; Smart Greenhouse Automation - ESP32-C3 Super Mini

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Serial Monitor speed (make sure it matches Serial.begin)
monitor_speed = 115200
upload_port = COM15

; Libraries required for sensors and hardware
lib_deps =
    adafruit/RTClib @ ^2.1.3
    milesburton/DallasTemperature @ ^3.11.0
    paulstoffregen/OneWire @ ^2.3.8
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; Advanced compile options for ESP32-C3 (recommended for stability)
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -w

; Re-enable warnings only for your source code
build_src_flags =
    -Wall